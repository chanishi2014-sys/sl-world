<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>守備責任・打球条件診断 | SL WORLD</title><link rel="stylesheet" href="engine-lab.css"><link rel="stylesheet" href="game-view.css"><link rel="stylesheet" href="responsibility-lab.css"></head><body><header><div class="brand">研究所 ＞ 守備研究</div><h1>守備責任・打球条件診断</h1><nav><a href="research.html">← 研究所へ戻る</a><a href="engine006.html">試合画面</a></nav></header><main>
<form id="setup"><section><h2>1 場面設定</h2><div class="grid"><label>アウト<select id="outs"><option value="0">0アウト</option><option value="1">1アウト</option><option value="2">2アウト</option></select></label><fieldset><legend>走者</legend><label><input id="runner1" type="checkbox">一塁</label><label><input id="runner2" type="checkbox">二塁</label><label><input id="runner3" type="checkbox">三塁</label></fieldset></div><details><summary>能力条件</summary><div class="grid"><label>守備力<input id="fielding" type="number" min="1" max="20" value="14"></label><label>肩力<input id="arm" type="number" min="1" max="20" value="14"></label><label>捕球力<input id="catching" type="number" min="1" max="20" value="14"></label></div></details></section>
<section><h2>2 打球設定</h2><div class="grid"><label>方向（左 − / 右 +）<input id="direction" type="range" min="-.78" max=".78" step=".01" value=".35"><output id="directionValue">0.35</output></label><label>打球速度 m/s<input id="exitVelocity" type="number" min="5" max="60" step="1" value="32"></label><label>角度 °<input id="launchAngle" type="number" min="-10" max="75" step="1" value="8"></label><label>滞空時間 秒<input id="hangTime" type="number" min="0" max="10" step=".1" value="2.4"></label><label>seed<input id="seed" value="defense-research-001" maxlength="120"></label><label>テスト名<input id="label" value="RF前方打球" maxlength="40"></label></div><p class="note">設定するのは場面・打球・能力・seedだけです。担当者や役割は現行守備AIが決めます。</p></section>
<section><h2>3 診断方法</h2><div class="counts" role="radiogroup"><label><input name="count" type="radio" value="1" checked>1回 詳細</label><label><input name="count" type="radio" value="10">10回</label><label><input name="count" type="radio" value="100">100回</label><label><input name="count" type="radio" value="500">500回</label><label><input name="count" type="radio" value="1000">1000回</label><label><input name="count" type="radio" value="custom">任意</label></div><label id="customWrap" hidden>任意回数<input id="customCount" type="number" min="1" max="10000" value="250"></label></section>
<section class="run"><h2>4 実行</h2><button class="primary wide" id="run" type="submit">診断開始</button><button id="cancel" type="button" hidden>中止</button><progress id="progress" max="1" value="0"></progress><p id="status" role="status">条件を決めて診断を開始してください。</p></section></form>
<section id="results" hidden><h2>5 結果</h2><nav class="tabs"><button data-tab="roles">守備責任</button><button data-tab="stats">統計結果</button><button data-tab="flags">怪しい試行</button><button data-tab="json">JSON</button></nav><div id="diagnosticViewer" hidden></div><div id="summary"></div><div id="detail"></div><div id="flags"></div><div class="toolbar"><button id="save">JSON保存</button><button id="compare">前回結果と違う項目</button></div><pre id="comparison"></pre></section>
</main><script src="engine006-fielding.js"></script><script src="engine006-tactics.js"></script><script src="engine006-replay.js"></script><script src="engine006-viewer.js"></script><script src="engine006.js"></script><script src="engine-lab-core.js"></script><script src="decision-trace-core.js"></script><script src="responsibility-lab-core.js"></script><script src="responsibility-lab-ui.js"></script></body></html>
