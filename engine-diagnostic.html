<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL WORLD プロセス診断LAB</title><link rel="stylesheet" href="engine-lab.css"><style>pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;overflow:auto}select{min-width:0}#summary{min-width:0}</style></head><body><header><div class="brand">SL WORLD / PROCESS LAB</div><h1>プレーの過程を比較する</h1><nav><a href="engine-lab.html">感度LABへ</a><a href="custom-match.html">CUSTOM MATCHへ</a></nav></header><main><section><h2>同じ条件で原因を調べる</h2><p>能力 → 中間値 → 判断 → 時間 → プレーを記録します。試行ごとの同じseedを条件間で共有します。</p><label>診断<select id="scenario"><option value="A">LAB-A 内野ゴロ・一塁到達競争</option><option value="B">LAB-B 守備力プロセス感度</option><option value="C">LAB-C パワー → 打球品質</option><option value="D">LAB-D スタミナ／疲労プロセス</option><option value="E">LAB-E 守備役割・浅いポテン</option></select></label><div class="grid"><label>比較値（カンマ区切り / CUSTOM可）<input id="values" value="20,14,2"></label><label>各条件の試行数<input id="count" type="number" min="1" max="10000" value="100"></label><label>seed<input id="seed" value="process-0914"></label><label id="pitchCountsLabel" hidden>開始投球数（CUSTOM可）<input id="pitchCounts" value="0,80,140"></label></div><p id="description"></p><details id="fixed"><summary>一塁競争の固定条件</summary><div class="grid"><label>指定守備者<select id="fielder"><option value="5">SS</option><option value="3">2B</option><option value="4">3B</option><option value="2">1B</option><option value="8">RF（将来研究用）</option></select></label><label>守備力（Aのみ）<select id="fielding"><option value="20">S20</option><option value="14" selected>C14</option><option value="2">G2</option></select></label><label>肩力<select id="arm"><option value="20">S20</option><option value="14" selected>C14</option><option value="2">G2</option></select></label><label>打球速度 m/s<input id="ballSpeed" type="number" min="5" max="60" value="35"></label><label>方向 rad（左が負）<input id="direction" type="number" min="-0.78" max="0.78" step="0.01" value="-0.35"></label></div></details><div class="toolbar"><button id="run" class="primary">診断を実行</button><button id="cancel" disabled>中止</button></div><p id="status" role="status">条件を選択してください。</p><progress id="progress" max="1" value="0"></progress></section><section id="results" hidden><h2>過程の測定結果</h2><p>時間は秒。margin = runnerETA − ballETA。一塁競争では正ならボールが先着します。実際の失策や送球見送りはfinalResultとactualThrowで確認できます。</p><div id="summary"></div><div class="toolbar"><button id="save">診断JSONを保存</button></div><label>代表seed<select id="sample"></select></label><pre id="detail"></pre></section></main><script src="engine-diagnostic-ui.js"></script></body></html>
